<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI-SDLC: From Demos to Delivery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --navy: #1C3B54;
      --navy-deep: #0F2538;
      --gold: #DEBE00;
      --white: #FFFFFF;
      --orange: #D35400;
      --teal: #007B8A;
      --teal-glow: #00A3B5;

      --bg-light: #FAFAFA;
      --bg-dark: var(--navy-deep);
      --card-light: #FFFFFF;
      --card-dark: rgba(255, 255, 255, 0.05);
      --text-light: #1C1C20;
      --text-dark: #FFFFFF;
      --muted-light: #5A5A6A;
      --muted-dark: rgba(255, 255, 255, 0.7);

      --shadow-sm: 0 4px 12px rgba(15, 37, 56, 0.05);
      --shadow-md: 0 12px 32px rgba(15, 37, 56, 0.1);
      --border-light: rgba(28, 59, 84, 0.08);
      --border-dark: rgba(255, 255, 255, 0.1);

      --radius: 20px;
      --sans: 'Poppins', system-ui, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      margin: 0;
      font-family: var(--sans);
      background: var(--bg-light);
      color: var(--text-light);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .deck {
      position: fixed;
      inset: 0;
    }

    .slide {
      position: absolute;
      inset: 0;
      padding: 5vh 6vw 8vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3vh;
      opacity: 0;
      transform: scale(0.98) translateY(10px);
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      background: var(--bg-light);
      overflow-y: auto;
    }

    .slide.active {
      opacity: 1;
      transform: scale(1) translateY(0);
      pointer-events: auto;
      z-index: 10;
    }

    .slide.dark-mode {
      background: var(--bg-dark);
      color: var(--text-dark);
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--teal);
    }

    .slide.dark-mode .kicker {
      color: var(--gold);
    }

    .title {
      font-size: clamp(28px, 4vw, 52px);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--navy);
      max-width: 900px;
    }

    .slide.dark-mode .title {
      color: var(--white);
    }

    .subtitle {
      font-size: clamp(14px, 1.5vw, 18px);
      color: var(--muted-light);
      max-width: 700px;
      font-weight: 400;
      line-height: 1.5;
    }

    .slide.dark-mode .subtitle {
      color: var(--muted-dark);
    }

    .grid-bento {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .grid-split {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 40px;
      align-items: center;
    }

    .grid-split.reverse {
      grid-template-columns: 1.2fr 1fr;
    }

    .card {
      background: var(--card-light);
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .slide.dark-mode .card {
      background: var(--card-dark);
      border-color: var(--border-dark);
      backdrop-filter: blur(10px);
      color: var(--text-dark);
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }

    .card.glass {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
    }

    .slide.dark-mode .card.glass {
      background: rgba(15, 37, 56, 0.6);
    }

    .card h3 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--navy);
    }

    .slide.dark-mode .card h3 {
      color: var(--white);
    }

    .card p,
    .card li {
      font-size: 14px;
      line-height: 1.5;
      color: var(--muted-light);
    }

    .slide.dark-mode .card p,
    .slide.dark-mode .card li {
      color: var(--muted-dark);
    }

    .pill {
      display: inline-flex;
      padding: 5px 10px;
      background: rgba(0, 123, 138, 0.1);
      color: var(--teal);
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 10px;
      width: fit-content;
    }

    .slide.dark-mode .pill {
      background: rgba(222, 190, 0, 0.15);
      color: var(--gold);
    }

    .prompt-card {
      background: linear-gradient(135deg, rgba(0, 123, 138, 0.05), rgba(0, 123, 138, 0.01));
      border: 2px solid var(--teal);
      border-radius: var(--radius);
      padding: 16px 20px;
      position: relative;
    }

    .prompt-card::before {
      content: "💬 DISCUSSION";
      font-size: 10px;
      font-weight: 700;
      color: var(--teal);
      letter-spacing: 0.1em;
      display: block;
      margin-bottom: 6px;
    }

    .prompt-card p {
      font-size: 16px;
      font-weight: 600;
      color: var(--navy);
      font-style: italic;
    }

    .path-flow {
      stroke-dasharray: 10;
      animation: flow 1s linear infinite;
    }

    @keyframes flow {
      to {
        stroke-dashoffset: -20;
      }
    }

    .reveal {
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .slide.active .reveal {
      opacity: 1;
      transform: translateY(0);
    }

    .slide.active .reveal:nth-child(1) {
      transition-delay: 0.1s;
    }

    .slide.active .reveal:nth-child(2) {
      transition-delay: 0.2s;
    }

    .slide.active .reveal:nth-child(3) {
      transition-delay: 0.3s;
    }

    .slide.active .reveal:nth-child(4) {
      transition-delay: 0.4s;
    }

    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      pointer-events: none;
    }

    .footer-content {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      padding: 6px 14px;
      border-radius: 99px;
      border: 1px solid var(--border-light);
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 13px;
      font-family: var(--mono);
      color: var(--muted-light);
      box-shadow: var(--shadow-sm);
    }

    .dark-mode .footer-content {
      background: rgba(15, 37, 56, 0.8);
      border-color: var(--border-dark);
      color: var(--muted-dark);
    }

    .nav-arrow {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--card-light);
      border: 1px solid var(--border-light);
      display: grid;
      place-items: center;
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.2s;
      font-size: 14px;
    }

    .nav-arrow:hover {
      background: var(--navy);
      color: white;
      border-color: var(--navy);
    }

    .dark-mode .nav-arrow {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      color: white;
    }

    .dark-mode .nav-arrow:hover {
      background: var(--gold);
      color: var(--navy);
      border-color: var(--gold);
    }

    @media (max-width: 900px) {
      .grid-split {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .grid-split.reverse {
        grid-template-columns: 1fr;
      }

      .grid-bento {
        grid-template-columns: 1fr;
      }

      .title {
        font-size: 28px;
      }

      .slide {
        padding: 40px 20px 80px;
      }
    }

    .quote {
      font-size: clamp(24px, 3vw, 36px);
      font-weight: 700;
      font-style: italic;
      color: var(--gold);
      margin-top: 30px;
      text-align: center;
    }

    .quote-author {
      font-size: 14px;
      color: var(--muted-dark);
      text-align: center;
      margin-top: 10px;
    }

    /* Loading state */
    .loading-msg {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-size: 18px;
      color: var(--muted-light);
    }
  </style>
</head>

<body>

  <div class="deck" id="deck">
    <div class="loading-msg">Loading slides...</div>
  </div>

  <div class="footer">
    <div class="footer-content">
      <div id="slide-counter">1 / 12</div>
      <div style="width:1px; height:12px; background:currentColor; opacity:0.3"></div>
      <div id="slide-title">Introduction</div>
    </div>

    <div style="display:flex; gap:10px">
      <div class="nav-arrow" id="prevBtn">←</div>
      <div class="nav-arrow" id="nextBtn">→</div>
    </div>
  </div>

  <script>
    // Slide file manifest (order matters)
    const slideFiles = [
      'slides/slide-01-intro.html',
      'slides/slide-02-context.html',
      'slides/slide-03-reality.html',
      'slides/slide-04-two-modes.html',
      'slides/slide-05-method.html',
      'slides/slide-06-evidence.html',
      'slides/slide-07-collaboration.html',
      'slides/slide-08-legacy.html',
      'slides/slide-09-roles.html',
      'slides/slide-10-adoption.html',
      'slides/slide-11-discussion.html',
      'slides/slide-12-end.html'
    ];

    const deck = document.getElementById('deck');
    const counter = document.getElementById('slide-counter');
    const titleDisplay = document.getElementById('slide-title');
    let currentIdx = 0;
    let slides = [];

    // Load all slides
    async function loadSlides() {
      deck.innerHTML = ''; // Clear loading message

      for (const file of slideFiles) {
        try {
          const res = await fetch(file);
          if (!res.ok) throw new Error(`Failed to load ${file}`);
          const html = await res.text();
          deck.insertAdjacentHTML('beforeend', html);
        } catch (err) {
          console.error(err);
          deck.insertAdjacentHTML('beforeend', `<section class="slide"><h2>Error loading slide</h2><p>${file}</p></section>`);
        }
      }

      slides = document.querySelectorAll('.slide');
      if (slides.length > 0) {
        slides[0].classList.add('active');
        update();
      }
    }

    function update() {
      slides.forEach((s, i) => {
        s.classList.toggle('active', i === currentIdx);
        s.style.zIndex = i === currentIdx ? 10 : 0;
      });
      counter.textContent = `${currentIdx + 1} / ${slides.length}`;
      titleDisplay.textContent = slides[currentIdx]?.dataset.title || '';

      // Update footer dark mode
      const isDark = slides[currentIdx]?.classList.contains('dark-mode');
      document.querySelector('.footer').classList.toggle('dark-mode', isDark);
    }

    function next() {
      if (currentIdx < slides.length - 1) {
        currentIdx++;
        update();
      }
    }

    function prev() {
      if (currentIdx > 0) {
        currentIdx--;
        update();
      }
    }

    document.getElementById('nextBtn').addEventListener('click', next);
    document.getElementById('prevBtn').addEventListener('click', prev);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') next();
      if (e.key === 'ArrowLeft') prev();
    });

    // Initialize
    loadSlides();
  </script>

</body>

</html>
